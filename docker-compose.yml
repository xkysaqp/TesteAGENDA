version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: agendaapp-postgres
    environment:
      POSTGRES_DB: AgendaApp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sua_senha_aqui
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Opcional: Redis para cache (descomente se necessário)
  # redis:
  #   image: redis:7-alpine
  #   container_name: agendaapp-redis
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis_data:/data
  #   restart: unless-stopped

volumes:
  postgres_data:
  # redis_data:
